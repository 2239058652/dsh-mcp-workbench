name: release

# Release pipeline for a `v*` tag pushed to main: re-runs the full gate,
# refuses to release when the tag does not name the package version, and creates
# a GitHub Release whose notes are the matching CHANGELOG section.
#
# No npm publish: this fork is distributed over the git channel
# (`dsh plugin add github:2239058652/dsh-mcp-workbench`), and the npm name is
# not ours to publish. See README §安装.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse mismatched tag/version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"
      - name: Gate
        run: |
          pnpm run typecheck:ci
          pnpm test
          pnpm run build
          pnpm run verify:self-contained
          pnpm run verify:artifacts
      - name: Build release notes from the changelog section
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
